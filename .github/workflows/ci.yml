name: Catalyst CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Security & Test Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Automated Security Vulnerability Audit
        run: npm audit --audit-level=high || true

      - name: TypeScript Typecheck
        run: npm run typecheck --if-present

      - name: Linting Verification
        run: npm run lint --if-present

      - name: Run Automated Comprehensive Test Suites
        run: npm test

      - name: Production Build Validation
        run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: production
